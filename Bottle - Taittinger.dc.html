<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  a { color: #8a6b4f; }

</style>
</helmet>

      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G" />

  </g>
  <g filter="url(#rough2)">
    <ellipse cx="150" cy="300" rx="26" ry="20" fill="#A62B22" stroke="#C79A46" stroke-width="3" />
    <path d="M 143,292 L 150,286 L 157,292 L 154,310 L 146,310 Z" fill="#E4C077" />
  </g>
  <g filter="url(#rough2)" fill="none" stroke="#FFFFFF" stroke-linecap="round">

  <g filter="url(#rough2)">
    <path d="M 66,750 L 234,748 L 236,900 L 64,902 Z" fill="#FBF9F2" />
  </g>

    <g filter="url(#rough3)">
      <ellipse cx="150" cy="778" rx="17" ry="14" fill="#B23A2A" stroke="#C79A46" stroke-width="2.4" />

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:1000},&quot;showLabelArt&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { showLabelArt: this.props.showLabelArt ?? true };
  }
}
</script>
</body>
</html>
