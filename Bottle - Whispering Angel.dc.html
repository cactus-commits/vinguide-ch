<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  a { color: #8a6b4f; }
  a:hover { color: #5c4735; }
</style>
</helmet>

<svg viewBox="0 0 300 1000" width="300" height="1000" style="display:block;background:transparent;overflow:visible;font-family:Caveat, cursive">
  <defs>
    <filter id="rough" x="-12%" y="-8%" width="124%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.04" numOctaves="3" seed="9" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="rough2" x="-12%" y="-8%" width="124%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.06" numOctaves="3" seed="3" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="rough3" x="-12%" y="-8%" width="124%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.08" numOctaves="2" seed="21" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <pattern id="goldcheck" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#C09A54" />
      <rect width="9" height="9" fill="#DFC58C" />
      <rect x="9" y="9" width="9" height="9" fill="#DFC58C" />
    </pattern>
  </defs>
  <g filter="url(#rough)">
    <path d="M 122,52 L 122,250 C 122,330 60,382 58,520 C 57,640 62,762 66,940 Q 66,966 88,966 L 212,966 Q 234,966 234,940 C 238,762 243,640 242,520 C 240,382 178,330 178,250 L 178,52 Z" fill="#F0CCBE" />
    <path d="M 236,520 C 238,660 236,820 230,940" fill="none" stroke="#DCA795" stroke-width="9" stroke-linecap="round" opacity="0.55" />
    <path d="M 118,50 L 182,50 L 184,188 C 160,198 140,198 116,188 Z" fill="url(#goldcheck)" />
    <path d="M 116,186 C 140,197 160,197 184,186 L 184,206 C 160,216 140,216 116,206 Z" fill="#B08945" />
  </g>
  <g filter="url(#rough2)" fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M 138,72 C 135,130 135,200 136,238" stroke-width="7" opacity="0.85" />
    <path d="M 96,330 C 88,450 86,600 90,730" stroke-width="13" opacity="0.9" />
    <path d="M 108,360 C 102,470 101,590 104,690" stroke-width="5" opacity="0.6" />
    <path d="M 208,560 C 212,660 212,760 209,850" stroke-width="6" opacity="0.5" />
    <path d="M 92,938 C 130,954 176,954 210,940" stroke-width="8" opacity="0.85" />
  </g>
  <g filter="url(#rough2)">
    <path d="M 76,700 L 224,698 L 226,896 L 74,898 Z" fill="#F8F4E9" />
    <path d="M 150,620 C 162,626 166,640 158,650 C 150,660 138,656 136,644 C 134,632 140,622 150,620 Z" fill="none" stroke="#E0B7A6" stroke-width="3" />
  </g>
  <sc-if value="{{ showLabelArt }}" hint-placeholder-val="{{ true }}">
    <g filter="url(#rough3)" fill="none" stroke="#C4788A" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
      <path d="M 92,730 C 104,748 98,768 110,782 C 122,796 112,814 122,828" />
      <path d="M 200,726 C 190,746 198,764 188,780 C 178,796 188,812 180,826" />
      <path d="M 118,742 C 130,736 142,744 140,754" />
      <path d="M 176,746 C 166,740 156,748 158,758" />
      <circle cx="104" cy="852" r="4" />
      <circle cx="196" cy="848" r="4" />
      <circle cx="150" cy="726" r="5" stroke="#D9A24E" />
    </g>
  </sc-if>
  <g text-anchor="middle" fill="#4A3B33" font-family="Caveat, cursive">
    <text x="150" y="800" font-size="21">Whispering Angel</text>
    <text x="150" y="828" font-size="16" fill="#8A7A6C">Côtes de Provence Rosé</text>
    <text x="150" y="876" font-size="13" fill="#8A7A6C">750ml · Alc. 13%</text>
  </g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:1000},&quot;showLabelArt&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { showLabelArt: this.props.showLabelArt ?? true };
  }
}
</script>
</body>
</html>
